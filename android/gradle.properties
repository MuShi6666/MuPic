org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Pin the Gradle daemon (and therefore Android Studio's Gradle Sync) to JDK 17.
# Android Studio Rabbit 1 bundles JBR 25, which Gradle 8.14 cannot run on, so
# without this the sync fails and every android.*/io.flutter.* symbol shows up
# as "Unresolved reference". Forward slashes work on Windows in .properties.
org.gradle.java.home=C:/Users/mushi/sdk/jdk17
